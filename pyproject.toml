[project]
name = "hdtool"
version = "0.1.0"
description = "Tổng hợp hóa đơn điện tử VN qua email ra Excel"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hdtool = "hdtool.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
