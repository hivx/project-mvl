# Cấu hình nhận diện & quét hóa đơn. Sửa file này để mở rộng, không cần đụng code.

# Các công ty NHẬN hóa đơn (bên mua): MST -> tên folder. Hóa đơn tới 1 trong các
# MST này = mua-vào (gắn nhãn công ty); MST khác = CC nhầm. Thêm pháp nhân ở đây.
companies:
  "0109529507": miyano
  "0108186705": medcons

# Hộp thư nào thuộc công ty nào. Chọn công ty khi chạy -> CHỈ quét hộp thư của
# công ty đó (nhanh hơn, log không lẫn). Hộp thư KHÔNG khai ở đây thì vẫn được
# quét cho mọi công ty — mặc định an toàn, thà quét thừa còn hơn sót hóa đơn.
# Thư mục lưu và bảng kê VẪN chia theo MST bên mua đọc từ XML (đúng luật);
# hóa đơn "lạc công ty" sẽ được cảnh báo chứ không bị xếp sai.
mailboxes:
  info@miyano.com.vn:         miyano
  mvl.invoices2024@gmail.com: miyano
  anh.doan@medcons.vn:        medcons

# Kỳ mặc định (NGÀY LẬP hóa đơn). Trong menu tương tác (`python run.py`) nhấn Enter
# ở ô ngày sẽ dùng khoảng này; `hdtool run`/`report` không kèm --from/--to cũng vậy.
# Truyền --from/--to (hoặc gõ ngày trong menu) sẽ ghi đè. Để trống nếu muốn bắt
# buộc nhập ngày mỗi lần.
default_from: "2026-06-01"
default_to: "2026-06-30"

# Cửa sổ ngày quét email = [from - pad_before, to + pad_after], rồi lọc lại theo
# ngày lập (NLap) trong XML. Nới rộng để bắt hóa đơn tháng trước gửi đầu tháng sau.
pad_before_days: 15
pad_after_days: 45

# Ngưỡng chấm điểm email
certain_threshold: 5
suspect_threshold: 2

# Domain/nhà phát hành hóa đơn điện tử VN (khớp theo chuỗi con trong địa chỉ gửi)
issuer_domains:
  - sinvoice
  - vnpt
  - meinvoice
  - misa
  - easyinvoice
  - viettel
  - mobifone
  - bkav
  - softdreams
  - wininvoice
  - minvoice
  - hilo
  - fpt
  - hoadon
  - einvoice

# Từ khóa tiêu đề (khớp không phân biệt hoa thường)
keywords:
  - "hóa đơn"
  - "hoá đơn"
  - "hoa don"
  - "invoice"
  - "hđđt"
  - "hddt"
  - "e-invoice"
  - "einvoice"
  - "biên lai"

# Người gửi đã biết chắc là hóa đơn -> luôn nhận (điền dần khi xác nhận thực tế)
whitelist_senders: []

# Người gửi KHÔNG BAO GIỜ gửi HĐ GTGT (biên lai NH, sao kê…) -> loại khỏi ứng viên.
# Khớp chuỗi con trong địa chỉ người gửi; nếu email lại có XML thì VẪN giữ (để
# không mất HĐ thật). Ví dụ VCBDigibank chỉ gửi "biên lai chuyển tiền".
exclude_senders:
  - vcbdigibank
