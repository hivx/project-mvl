# Sổ công thức tải hóa đơn theo nhà cung cấp.
#
# Tool TỰ GHI vào đây sau mỗi lần dò thành công (portal_probe.fetch_link_only ->
# ncc.learn). Bạn sửa tay được. File này CÓ commit — công thức đi theo repo;
# còn sổ hóa đơn nằm trong data/ là dữ liệu cục bộ, không commit.
#
# Registry là BỘ NHỚ ĐỆM, không phải điều kiện tiên quyết: cổng chưa có ở đây
# vẫn tải được (tool dò từ đầu), có công thức chỉ để đi tắt.
#
# - dung_adapter : cổng phức tạp (CSRF + POST + zip) -> dùng adapter code riêng.
# - phai_do_lai  : link ký theo phiên, không template hóa theo mã được.

- ten: einvoice.com.vn
  nhan_dien: [einvoice.com.vn]
  dung_adapter: einvoice_com_vn

- ten: VNPT
  nhan_dien: [vnpt-invoice.com.vn]
  dung_adapter: vnpt_invoice
  phai_do_lai: true

- ten: Fast e-Invoice
  nhan_dien: [einvoice.fast.com.vn]
  dung_adapter: fast_einvoice
  phai_do_lai: true
